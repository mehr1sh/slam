[workspace]
authors = ["Mehrish Khan"]
channels = ["conda-forge"]
name = "implementation"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
configure = "cmake -B build -S ."
build = { cmd = "cmake --build build -j", depends-on = ["configure"] }

[dependencies]
opencv = ">=4,<5"
cmake = ">=4.4.3,<5"
cxx-compiler = ">=2.0.0,<3"
eigen = ">=5.0.1,<6"
g2o = ">=2019.11.23,<2020"
sophus = ">=1!1.24.6,<1!2"
